# Central project settings. Change values here, not inside notebooks.

seed: 42                    # main random seed (spec: seeds must be recorded)

data:
  category: Toys_and_Games  # Amazon Reviews'23 category file (decided in task 3)
  raw_dir: data/raw
  processed_dir: data/processed

subset:
  # Decided in task 3 (2026-10-15), BEFORE any modeling; do not change after
  # seeing results. A product is in the subset if ANY entry of its `categories`
  # list (Amazon's own category tree) matches this regex (case-insensitive).
  name: remote_controlled
  category_regex: 'remote\s*&\s*app\s*controlled|remote[- ]control'
  # Spare parts / accessories are KEPT (decided in task 4, 2026-10-15); vehicles
  # vs parts is compared later as a subgroup analysis (phase 4).

modalities:
  # Decided in task 6 (2026-10-15). Review images dropped (8% coverage, driven
  # by year rather than rating); product images = optional phase-3 experiment.
  - review_text
  - time
  - product_structured   # sub-category, price (+ price_missing flag), store

window:
  # Decided in task 10 (2026-10-27), BEFORE any modeling.
  months: 3                 # calendar windows (Jan-Mar, Apr-Jun, ...); 1 and 6 = phase-4 sensitivity
  min_reviews: 20           # a product-window is report-ready if it has >= 20 reviews
                            # (threshold on review COUNT only, never on ratings)
  start: "2015-01-01"       # earlier years have < 200 report-ready windows per year
  end: "2023-03-31"         # windows from Apr 2023 are incomplete (Q2 = 62%, Q3 = 16% of 2022)

split:
  # Temporal split (task 11, LOCKED 2026-10-27, before any modeling). Boundaries fall on window
  # starts, so no 3-month window is cut in two. The test period is LOCKED:
  # it is used once, at the end of phase 3, never for tuning.
  # train      = window.start   .. validation_start - 1 day
  # validation = validation_start .. test_start - 1 day
  # test       = test_start     .. window.end
  validation_start: "2021-01-01"
  test_start: "2022-01-01"
